name: Build Cannon Kernel SukiSU+SUSFS
on:
  workflow_dispatch: # 手动触发编译，在Actions页面点Run workflow

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y git curl wget build-essential libssl-dev libelf-dev bison flex python3 cpio unzip rsync

      - name: Clone cannon kernel source
        uses: actions/checkout@v4
        with:
          repository: xiaomi-mt6853-devs/android_kernel_xiaomi_cannon
          ref: lineage-20
          path: kernel
          fetch-depth: 1

      - name: Download AOSP Clang
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r32/clang-r383902.tar.gz
          tar -xf clang-r383902.tar.gz -C clang
          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_ENV

      - name: Apply SukiSU Ultra + SUSFS patch
        run: |
          cd $GITHUB_WORKSPACE/kernel
          # 拉取SukiSU Ultra内核补丁
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash
          # 拉取SUSFS模块
          git clone https://github.com/SukiSU-Ultra/SUSFS kernel/drivers/susfs
          # 开启内核配置项 KPM、KALLSYMS、SUSFS
          ./scripts/config --file .config \
          -e CONFIG_KPM \
          -e CONFIG_KALLSYMS \
          -e CONFIG_KPROBES \
          -e CONFIG_KPROBE_EVENTS \
          -e CONFIG_MODULES \
          -e CONFIG_SUSFS

      - name: Build kernel config (cannon_defconfig)
        run: |
          cd $GITHUB_WORKSPACE/kernel
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- CC=${{ env.CLANG_PATH }}/clang cannon_defconfig

      - name: Compile kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- CC=${{ env.CLANG_PATH }}/clang -j$(nproc)

      - name: Download mkbootimg tools
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/osm0sis/mkbootimg.git mkboot
          cd mkboot && make

      - name: Pack boot.img
        run: |
          cd $GITHUB_WORKSPACE
          # 用默认ramdisk打包boot镜像
          $GITHUB_WORKSPACE/mkboot/mkbootimg \
          --kernel $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.lz4-dtb \
          --ramdisk /dev/null \
          --base 0x40000000 \
          --pagesize 4096 \
          --header_version 2 \
          -o boot.img

      - name: Upload boot.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: cannon-boot-sukisu-susfs
          path: boot.img
