name: MIUI14.0.6 Cannon | Patch boot-14.img + Build SukiSU KPM AnyKernel3
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt upgrade -y
          sudo apt install -y git curl wget unzip zip bison flex bc libssl-dev libelf-dev python3 cpio rsync

      - name: Checkout repo（仓库根目录存放 boot-14.img）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull latest SukiSU-Ultra & SUSFS & AnyKernel3
        run: |
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git sukisu
          git clone --depth=1 https://github.com/SukiSU-Ultra/SUSFS.git susfs
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3

      - name: Download latest AOSP Clang
        run: |
          mkdir -p clang
          LATEST_CLANG=$(curl -s https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main?format=TEXT | base64 -d | grep -E "refs/tags/android-[0-9.]+_r[0-9]+" | tail -1 | awk '{print $2}')
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$LATEST_CLANG/clang.tar.gz
          tar -xf clang.tar.gz -C clang
          echo "CLANG_BIN=$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_ENV
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

      - name: Patch boot-14.img，开启KPM
        run: |
          cd $GITHUB_WORKSPACE/sukisu
          # 传入你仓库里的 boot-14.img 进行补丁
          bash kernel/patch.sh $GITHUB_WORKSPACE/boot-14.img
          cp patched-boot.img $GITHUB_WORKSPACE/boot-kpm-sukisu-miui14.img

      - name: Build KPM LKM modules（SukiSU + SUSFS）
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          cd $GITHUB_WORKSPACE/sukisu/kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=${{ env.CLANG_BIN }}/clang M=$PWD KPM=1
          cd $GITHUB_WORKSPACE/susfs
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=${{ env.CLANG_BIN }}/clang M=$PWD

      - name: Build AnyKernel3 KPM Zip包（SukiSU KPM AnyKernel3）
        run: |
          cd $GITHUB_WORKSPACE/ak3
          rm -rf modules
          mkdir modules
          cp $GITHUB_WORKSPACE/sukisu/kernel/*.ko modules/
          cp $GITHUB_WORKSPACE/susfs/*.ko modules/
          zip -r9 $GITHUB_WORKSPACE/SukiSU-KPM-AK3-MIUI14-cannon.zip *

      - name: Upload产物
        uses: actions/upload-artifact@v4
        with:
          name: MIUI14-cannon-sukisu-kpm-full
          path: |
            boot-kpm-sukisu-miui14.img
            SukiSU-KPM-AK3-MIUI14-cannon.zip
