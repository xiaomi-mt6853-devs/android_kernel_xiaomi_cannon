name: Cannon MT6853 Android12 4.14.186 内核 + BakaSU + SUSFS
on:
  workflow_dispatch:
env:
  PROJECT_NAME: Cannon-BakaSU-SUSFS-Kernel
  VERSION: V1.3
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      name: 检出fork仓库源码

    - name: 构建编译内核环境 & 创建工作目录
      run: |
        sudo apt-get update
        sudo -E apt-get -y -qq install git make bc bison ccache openssl dos2unix zip unzip kmod cpio flex libelf-dev curl libssl-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu xz-utils abootimg
        sudo -E apt-get -y -qq install libtinfo5 libncurses5 || true
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: 下载 clang 11.0.1 工具链（LLVM 官方 release）
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        # 原厂内核 banner: "Android (6443078 based on r383902) clang version 11.0.1"。
        # 采用 LLVM 官方 11.0.1 release（版本号与原厂一致；基于 ubuntu-20.10 构建，
        # 依赖 libtinfo.so.6，可在 ubuntu-latest 直接运行）。原厂用的 AOSP 镜像多为
        # 第三方 fork（bin/clang 被换成 Go 包装器、ld.lld 仅 3 字节），故不走镜像。
        mkdir clang
        wget -O clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-11.0.1/clang%2Bllvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10.tar.xz"
        tar -C clang/ --strip-components=1 -xJf clang.tar.xz
        rm -f clang.tar.xz
        test -x clang/bin/clang || { echo "❌ clang 未解出"; ls -l clang; exit 1; }
        if ! clang/bin/clang --version >/dev/null 2>&1; then
          echo "❌ clang 无法运行"; ldd clang/bin/clang || true; exit 1
        fi
        clang/bin/clang --version | head -1
        clang/bin/clang --version | grep -q "clang version 11.0.1" || { echo "❌ clang 版本非 11.0.1"; exit 1; }
        echo "✅ clang 11.0.1 就绪"

    - name: 集成 BakaSU（KernelSU分支，内置 su）
      run: |
        cd $GITHUB_WORKSPACE
        curl -LSs --retry 3 https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh -o /tmp/bakasu-setup.sh
        bash /tmp/bakasu-setup.sh main
        ls -l drivers/kernelsu
        grep -n "kernelsu" drivers/Makefile
        grep -n "kernelsu" drivers/Kconfig

    - name: 集成 SUSFS v2.3.0 内核补丁 + 非GKI inline hooks
      run: |
        cd $GITHUB_WORKSPACE

        echo "==== 1) 内核侧 SUSFS v2.3.0 (kernel 4.14) ===="
        curl -LSs --retry 3 https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.14.patch -o /tmp/susfs_4.14.patch
        patch -p1 --forward --fuzz=3 --no-backup-if-mismatch < /tmp/susfs_4.14.patch || true

        # 修复 task_mmu.c 的 MTK 特有问题（本地已按该内核逐条验证）：
        #  1) MTK 删掉了 <linux/ctype.h>，SUSFS 补丁的 include 块在 task_mmu.c 定位失败 -> 补回 susfs_def.h
        #  2) MTK 把 smaps 统计拆成 void smap_gather_stats()，SUSFS 的 show_smap(返回int) hunk 被 fuzz 错落到该
        #     void 函数 -> "void function 'smap_gather_stats' should not return a value"。移除错位块并在
        #     int show_smap()/show_smaps_rollup() 里正确重新插入。
        python3 - <<'EOF'
        p = 'fs/proc/task_mmu.c'
        s = open(p).read()

        if 'susfs_def.h' not in s:
            anchor = '#include <linux/mm_inline.h>\n'
            assert anchor in s, 'mm_inline.h anchor missing'
            inc = ('#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || '
                   'defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n'
                   '#include <linux/susfs_def.h>\n'
                   '#endif\n')
            s = s.replace(anchor, anchor + inc, 1)

        block = ('#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n'
                 '\tif (vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n'
                 '\t\treturn 0;\n'
                 '#endif\n')
        if block in s:
            i = s.find(block)
            s = s[:i] + s[i + len(block):]

        memset = '\tmemset(&mss, 0, sizeof(mss));\n'
        cnt = s.count(memset)
        assert cnt >= 1, 'memset anchor missing'
        s = s.replace(memset, block + memset)

        open(p, 'w').write(s)
        print('[fix] task_mmu.c patched:', cnt, 'int-smaps blocks inserted')
        EOF
        rm -f fs/proc/task_mmu.c.rej

        if find . -name '*.rej' | grep -q .; then
          echo "❌ SUSFS 内核补丁存在冲突(.rej)，请根据下列内容手工适配："
          find . -name '*.rej' -print
          find . -name '*.rej' -exec sh -c 'echo "----- {} -----"; cat "{}"' \;
          exit 1
        fi
        test -f fs/susfs.c || { echo "❌ fs/susfs.c 未生成"; exit 1; }
        test -f include/linux/susfs.h || { echo "❌ include/linux/susfs.h 未生成"; exit 1; }
        test -f include/linux/susfs_def.h || { echo "❌ include/linux/susfs_def.h 未生成"; exit 1; }
        grep -q 'SUSFS_VERSION "v2' include/linux/susfs.h || { echo "❌ SUSFS 版本非 v2.x"; grep -n SUSFS_VERSION include/linux/susfs.h; exit 1; }

        echo "==== 2) KernelSU 非GKI inline hooks (ksu_handle_*) ===="
        curl -LSs --retry 3 https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh -o /tmp/susfs_inline.sh
        bash /tmp/susfs_inline.sh

        echo "==== 3) 校验 BakaSU inline_hook_check 需要的调用点 ===="
        for chk in "ksu_handle_setresuid:kernel/sys.c" "ksu_handle_execveat:fs/exec.c" "ksu_handle_faccessat:fs/open.c" "ksu_handle_sys_read:fs/read_write.c" "ksu_handle_stat:fs/stat.c" "ksu_handle_sys_reboot:kernel/reboot.c" "ksu_handle_input_handle_event:drivers/input/input.c"; do
          sym=${chk%%:*}; file=${chk##*:}
          if ! grep -q "$sym" "$file"; then echo "❌ 缺少 $sym in $file"; exit 1; fi
          echo "✅ $sym -> $file"
        done
        echo "✅ SUSFS v2.3.0 + inline hooks 集成完成"

    - name: 设置ccache缓存
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-cannon-mt6853-full-kernel-bakasu
        max-size: 1G

    - name: 清理旧out输出目录
      run: |
        cd $GITHUB_WORKSPACE
        rm -rf out

    - name: 以原厂 stock .config 为基底，开启 BakaSU + SUSFS 配置
      run: |
        cd $GITHUB_WORKSPACE
        # 原厂同款：clang 11.0.1 + LLD（stock config 含 CONFIG_LTO_CLANG/THINLTO=y，LTO 链接必须用
        # lld，否则 Makefile:681-687 回退到 ld.gold 并把 lld 专属 --thinlto-cache-dir 传给 gold 报错）。
        # 故走 LLVM=1（LD=ld.lld / AR=llvm-ar / NM=llvm-nm / OBJCOPY=llvm-objcopy ...）。
        CLANG_DIR="$GITHUB_WORKSPACE/kernel_workspace/clang"
        export PATH="$CLANG_DIR/bin:$PATH"
        export LLVM=1
        export LLVM_IAS=1
        export CC="$CLANG_DIR/bin/clang"
        export LD="$CLANG_DIR/bin/ld.lld"
        export CROSS_COMPILE="aarch64-linux-gnu-"
        export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
        export CLANG_TRIPLE="aarch64-linux-gnu-"
        echo "== 工具链检查 =="
        "$CC" --version | head -1
        "$LD" --version | head -1
        ls -l "$CLANG_DIR/bin/llvm-ar" "$CLANG_DIR/bin/llvm-nm"
        command -v aarch64-linux-gnu-as aarch64-linux-gnu-elfedit || true

        rm -rf out && mkdir -p out
        # 从原版 boot-14.img 的内核里抽出原厂完整 .config（IKCONFIG 内嵌）作为构建基底：
        # 保证 MODVERSIONS/PREEMPT/各 MTK 选项与 stock 完全一致。此前用 cannon_defconfig
        # (LOCALVERSION="-perf-cus"、未开 MODVERSIONS) 重编，UTS/vermagic 与 stock 模块不符，
        # 极可能是卡 logo 的主因。
        python3 - <<'EOF'
        import struct, gzip
        d = open('boot-14.img', 'rb').read()
        page = struct.unpack('<I', d[36:40])[0]
        ksz  = struct.unpack('<I', d[8:12])[0]
        raw  = gzip.decompress(d[page:page + ksz])
        i = raw.find(b'IKCFG_ST'); j = raw.find(b'IKCFG_ED', i)
        assert i > 0 and j > i, 'stock 内核未内嵌 config（IKCONFIG）'
        cfg = gzip.decompress(raw[i + 8:j])
        open('out/.config', 'wb').write(cfg)
        print('[stock .config] bytes =', len(cfg))
        EOF
        grep -q '^CONFIG_MODVERSIONS=y' out/.config || { echo "❌ stock config 缺 MODVERSIONS"; exit 1; }

        # BakaSU 必需配置（CONFIG_KSU 来自集成后的 drivers/kernelsu/Kconfig）
        scripts/config --file out/.config -e DEBUG_KERNEL
        scripts/config --file out/.config -e KALLSYMS
        scripts/config --file out/.config -e KALLSYMS_ALL
        scripts/config --file out/.config -e KSU
        # 4.14 非GKI：使用 SUSFS Inline Hook 模式（内核侧已打 SUSFS v2.3.0 + inline hooks）
        scripts/config --file out/.config -e KSU_SUSFS
        scripts/config --file out/.config -d KSU_MANUAL_HOOK
        scripts/config --file out/.config -d KSU_TRACEPOINT_HOOK
        # SUSFS 功能子开关（默认即 y，这里显式开启）
        scripts/config --file out/.config -e KSU_SUSFS_SUS_PATH
        scripts/config --file out/.config -e KSU_SUSFS_SUS_MOUNT
        scripts/config --file out/.config -e KSU_SUSFS_SUS_KSTAT
        scripts/config --file out/.config -e KSU_SUSFS_SPOOF_UNAME
        scripts/config --file out/.config -e KSU_SUSFS_ENABLE_LOG
        scripts/config --file out/.config -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
        scripts/config --file out/.config -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
        scripts/config --file out/.config -e KSU_SUSFS_OPEN_REDIRECT
        scripts/config --file out/.config -e KSU_SUSFS_SUS_MAP
        scripts/config --file out/.config -d COMPAT_VDSO

        # 本树无 cannon.dts（只有 mt6853.dts），stock config 里的追加 DTB 名 "mediatek/cannon"
        # 在本树不存在，覆盖为 mt6853，否则 Image.gz-dtb 目标找不到 dtb 而失败。
        scripts/config --file out/.config -e BUILD_ARM64_APPENDED_DTB_IMAGE
        scripts/config --file out/.config --set-str BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES "mediatek/mt6853"

        # 对齐原厂 UTS/vermagic：stock = 4.14.186-perf-00243-g9a0d96109bda
        # （LOCALVERSION="-perf" + LOCALVERSION_AUTO=y）。用原厂全串并关闭 AUTO，
        # 使内核版本串与 vendor 模块的 vermagic 完全一致，避免模块 insmod 被拒。
        scripts/config --file out/.config --set-str LOCALVERSION "-perf-00243-g9a0d96109bda"
        scripts/config --file out/.config -d LOCALVERSION_AUTO

        # 探针：若 gcc 不支持 -fstack-protector-strong（Makefile 对 STRONG 会强制传该 flag，
        # 不支持则整树编译崩），回退到 Regular，避免全量失败
        if ! "$CC" -fstack-protector-strong -E -x c /dev/null >/dev/null 2>&1; then
          echo "⚠️ $CC 不支持 -fstack-protector-strong，回退 CC_STACKPROTECTOR_STRONG -> REGULAR"
          scripts/config --file out/.config -d CC_STACKPROTECTOR_STRONG -e CC_STACKPROTECTOR_REGULAR
        fi

        make -s O=out ARCH=arm64 olddefconfig

        # 打印核对配置
        grep -E "CONFIG_(KSU=|KSU_SUSFS=|KSU_SUSFS_SUS_MAP=|KSU_MANUAL_HOOK|KSU_TRACEPOINT_HOOK|DEBUG_KERNEL|MODULES=|KALLSYMS|MODVERSIONS=|LOCALVERSION|PREEMPT=|COMPAT=|RANDOMIZE_BASE=|CC_STACKPROTECTOR_STRONG=|BUILD_ARM64_APPENDED_DTB_IMAGE|ARCH_MTK_PROJECT)" out/.config
        grep -q "^CONFIG_KSU=y" out/.config || { echo "❌ CONFIG_KSU 未开启"; exit 1; }
        grep -q "^CONFIG_KSU_SUSFS=y" out/.config || { echo "❌ CONFIG_KSU_SUSFS 未开启"; exit 1; }
        grep -q "^# CONFIG_KSU_MANUAL_HOOK is not set" out/.config || { echo "❌ CONFIG_KSU_MANUAL_HOOK 必须关闭"; exit 1; }
        grep -q "^# CONFIG_KSU_TRACEPOINT_HOOK is not set" out/.config || { echo "❌ CONFIG_KSU_TRACEPOINT_HOOK 必须关闭"; exit 1; }

        # 与原厂对齐的版本/模块校验（vermagic 兼容 vendor 模块）
        grep -q '^CONFIG_LOCALVERSION="-perf-00243-g9a0d96109bda"' out/.config || { echo "❌ LOCALVERSION 未对齐原厂"; exit 1; }
        grep -q "^# CONFIG_LOCALVERSION_AUTO is not set" out/.config || { echo "❌ LOCALVERSION_AUTO 应关闭"; exit 1; }
        grep -q "^CONFIG_MODVERSIONS=y" out/.config || { echo "❌ MODVERSIONS 未开启"; exit 1; }
        grep -q "^CONFIG_MODULES=y" out/.config || { echo "❌ MODULES 未开启"; exit 1; }

        # MTK 厂商驱动符号检查（缺了 vmlinux 链接期会 undefined symbol）
        grep -q "^CONFIG_SND_SOC_AW87519=y" out/.config || { echo "❌ CONFIG_SND_SOC_AW87519 未开启"; exit 1; }
        grep -q "^CONFIG_SND_SOC_AW87359=y" out/.config || { echo "❌ CONFIG_SND_SOC_AW87359 未开启"; exit 1; }
        grep -q "^CONFIG_NXP_P73_DEVICES=y" out/.config || { echo "❌ CONFIG_NXP_P73_DEVICES 未开启"; exit 1; }
        grep -q "^CONFIG_REGULATOR_PM8008=y" out/.config || { echo "❌ CONFIG_REGULATOR_PM8008 未开启"; exit 1; }
        grep -q "^CONFIG_MTK_IMGSENSOR=y" out/.config || { echo "❌ CONFIG_MTK_IMGSENSOR 未开启"; exit 1; }
        grep -q '^CONFIG_ARCH_MTK_PROJECT="k6853v1_64_6360"' out/.config || { echo "❌ CONFIG_ARCH_MTK_PROJECT 应为 k6853v1_64_6360"; exit 1; }
        grep -q '^CONFIG_CUSTOM_KERNEL_IMGSENSOR=".*ov02b10ofilm_mipi_raw.*"' out/.config || { echo "❌ CONFIG_CUSTOM_KERNEL_IMGSENSOR 缺少 ov02b10ofilm_mipi_raw"; exit 1; }
        grep -q "^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y" out/.config || { echo "❌ CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE 未开启"; exit 1; }
        grep -q '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="mediatek/mt6853"' out/.config || { echo "❌ CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES 应为 mediatek/mt6853"; exit 1; }

    - name: 编译 Image.gz-dtb（clang 11.0.1 + GNU binutils，内置 BakaSU + SUSFS）
      run: |
        cd $GITHUB_WORKSPACE
        CLANG_DIR="$GITHUB_WORKSPACE/kernel_workspace/clang"
        export PATH="$CLANG_DIR/bin:$PATH"
        # 原厂 stock = clang 11.0.1 + LLD（stock config 含 CONFIG_LTO_CLANG/THINLTO=y）。
        # LTO 链接必须用 lld：否则 Makefile:681-687 会回退到 ld.gold 并把 lld 专属的
        # --thinlto-cache-dir 传给 gold 而报错。故走 LLVM=1（LD=ld.lld / AR=llvm-ar / NM=llvm-nm）。
        export LLVM=1
        export LLVM_IAS=1
        export CC="$CLANG_DIR/bin/clang"
        export LD="$CLANG_DIR/bin/ld.lld"
        export CROSS_COMPILE="aarch64-linux-gnu-"
        export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
        export CLANG_TRIPLE="aarch64-linux-gnu-"

        echo "==== 编译环境诊断 ===="
        nproc
        df -h /
        free -m | head -2
        "$CC" --version | head -1
        "$LD" --version | head -1
        ls -l "$CLANG_DIR/bin/llvm-ar" "$CLANG_DIR/bin/llvm-nm"
        command -v aarch64-linux-gnu-as aarch64-linux-gnu-elfedit || true

        # 原厂 = clang 11.0.1 + LLD：CC/LD 全部走 clang 11.0.1 + ld.lld（LLVM=1，integrated-as）。
        # 保留 -j2 + 失败续跑，防止 runner 内存不足把编译进程 OOM 杀掉。
        JOBS=2
        CMD=(make -s -j$JOBS O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
             CC="$CC" LD="$LD" CLANG_TRIPLE="$CLANG_TRIPLE" \
             CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
             Image.gz-dtb)
        for attempt in 1 2 3; do
          echo "==== 编译尝试 #${attempt} ===="
          "${CMD[@]}" || true
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && break
        done

        ls -l out/arch/arm64/boot/Image.gz-dtb out/vmlinux
        test -f out/arch/arm64/boot/Image.gz-dtb || { echo "❌ Image.gz-dtb 编译失败"; exit 1; }

        # 校验 DTB 确实被追加进 Image.gz-dtb（缺失会导致开机 logo 后死机）
        test -f out/arch/arm64/boot/dts/mediatek/mt6853.dtb || { echo "❌ mt6853.dtb 未生成"; exit 1; }
        gz_sz=$(stat -c%s out/arch/arm64/boot/Image.gz)
        dtd_sz=$(stat -c%s out/arch/arm64/boot/Image.gz-dtb)
        echo "Image.gz=$gz_sz Image.gz-dtb=$dtd_sz"
        [ "$dtd_sz" -gt "$gz_sz" ] || { echo "❌ Image.gz-dtb 未包含 DTB"; exit 1; }

        # 校验内核版本串已对齐原厂（应含 4.14.186-perf-00243-g9a0d96109bda）
        strings out/vmlinux | grep -m1 "Linux version" || true
        echo "==== 完整内核编译完成，BakaSU + SUSFS 已内置 ===="

    - name: 打包 new-boot.img（保留原版 v2 DTB 区）
      run: |
        cd $GITHUB_WORKSPACE
        # 本机制造的 boot-14.img 是 header v2：设备树在 boot 镜像自带 DTB 区（非内核追加），
        # lk 直接读镜像里的 DTB 区传给内核。abootimg 只认 v0、会丢掉 DTB 区导致开机 logo 后
        # 死机，因此改用自制 v2 重打包：完整保留原版 DTB 区/os_version/cmdline，仅替换内核。
        python3 - <<'EOF'
        import struct, os
        stock = 'boot-14.img'
        kpath = 'out/arch/arm64/boot/Image.gz-dtb'
        out = os.path.join('kernel_workspace', '%s-%s.img' % (os.environ['PROJECT_NAME'], os.environ['VERSION']))

        d = open(stock, 'rb').read()
        page  = struct.unpack('<I', d[36:40])[0]
        hsize = struct.unpack('<I', d[1644:1648])[0]
        ksz   = struct.unpack('<I', d[8:12])[0]
        rsz   = struct.unpack('<I', d[16:20])[0]
        dsz   = struct.unpack('<I', d[1648:1652])[0]
        ver   = struct.unpack('<I', d[40:44])[0]
        osv   = struct.unpack('<I', d[44:48])[0]
        assert ver == 2 and dsz > 0, '需要 v2 boot 镜像（当前 boot-14.img 是 v2）'
        kstart = page
        rstart = (kstart + ksz + page - 1) // page * page
        dstart = (rstart + rsz + page - 1) // page * page
        assert dstart + dsz <= len(d), 'DTB 区超出镜像'

        kdata = open(kpath, 'rb').read()
        def pad(b):
            r = len(b) % page
            return b if r == 0 else b + b'\0' * (page - r)

        hdr = bytearray(pad(d[0:hsize]))
        struct.pack_into('<I', hdr, 8, len(kdata))   # 仅更新 kernel_size
        img = bytes(hdr) + pad(kdata) + pad(d[rstart:rstart + rsz]) + pad(d[dstart:dstart + dsz])
        open(out, 'wb').write(img)

        # 回读自检
        c = open(out, 'rb').read()
        assert struct.unpack('<I', c[40:44])[0] == 2, 'header version 丢失'
        assert struct.unpack('<I', c[1648:1652])[0] == dsz, 'DTB 区丢失'
        assert struct.unpack('<I', c[44:48])[0] == osv, 'os_version 丢失'
        nk = struct.unpack('<I', c[8:12])[0]
        nr = (page + nk + page - 1) // page * page
        nd = (nr + rsz + page - 1) // page * page
        assert c[nd + 64:nd + 68] == b'\xd0\x0d\xfe\xed', 'FDT 未在预期位置'
        print('✅ %s 打包完成 (%d B): kernel=%d ramdisk=%d dtb=%d' % (os.path.basename(out), len(img), len(kdata), rsz, dsz))
        EOF

    - name: 制作内核AnyKernel3卡刷包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3 ak
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' ak/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' ak/anykernel.sh
        cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb ak/
        rm -rf ak/.git* ak/README.md
        cd ak
        zip -r ../${PROJECT_NAME}-${VERSION}.zip .
        cd ..

    - name: 上传 new-boot.img
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-boot-img
        path: kernel_workspace/${{ env.PROJECT_NAME }}-${{ env.VERSION }}.img

    - name: 上传 AnyKernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-AnyKernel-zip
        path: kernel_workspace/${{ env.PROJECT_NAME }}-${{ env.VERSION }}.zip