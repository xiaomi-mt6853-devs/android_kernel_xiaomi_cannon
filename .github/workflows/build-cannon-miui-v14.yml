name: Cannon MT6853 MIUI14 内核 + SukiSU KPM
on:
  workflow_dispatch:
env:
  PROJECT_NAME: Cannon-SukiSU-Kernel
  VERSION: V1.0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      name: 检出fork仓库源码

    - name: 构建编译内核环境 & 创建工作目录
      run: |
        sudo apt-get update
        sudo -E apt-get -y -qq install git make bc bison ccache openssl dos2unix zip kmod cpio flex libelf-dev curl libssl-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi abootimg
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        cp -r $GITHUB_WORKSPACE/. $GITHUB_WORKSPACE/kernel_workspace/android-kernel/
        ls -la $GITHUB_WORKSPACE/kernel_workspace/android-kernel

    - name: 下载 AOSP GCC4.9 交叉编译器
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir gcc64
        wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc64/ -zxvf gcc-aarch64.tar.gz
    
        mkdir gcc32
        wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc32/ -zxvf gcc-arm.tar.gz

    - name: 下载 AOSP Clang10
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

    - name: 4.14 set_memory 补丁（KPM必备）
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/patches/4.14/set_memory-backport.patch -o set_memory.patch
        git apply set_memory.patch || true
        echo "==== set_memory.h 补丁应用完成 ===="

    - name: 集成 SukiSU-Ultra 开启KPM
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        rm -rf sukisu
        wget --retry-connrefused --waitretry=1 --tries=3 https://github.com/SukiSU-Ultra/SukiSU-Ultra/archive/refs/heads/main.zip -O sukisu.zip
        unzip -q sukisu.zip
        mv SukiSU-Ultra-main sukisu

        export KPM=1
        bash sukisu/kernel/setup.sh susfs-main sukisu

    - name: 设置ccache缓存
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-cannon-mt6853-full-kernel-sukisu-kpm
        max-size: 2G

    - name: 清理旧out输出目录
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        rm -rf out

    - name: 加载defconfig，开启KPM内核配置
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH

        make -s -j$(nproc --all) O=out ARCH=arm64 k6853v1_64_defconfig

        # KPM必需配置
        sed -i 's/# CONFIG_DEBUG_KERNEL is not set/CONFIG_DEBUG_KERNEL=y/' out/.config
        sed -i 's/CONFIG_DEBUG_KERNEL=n/CONFIG_DEBUG_KERNEL=y/' out/.config

        sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/' out/.config
        sed -i 's/CONFIG_MODULES=n/CONFIG_MODULES=y/' out/.config

        sed -i 's/# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/' out/.config
        sed -i 's/CONFIG_KALLSYMS=n/CONFIG_KALLSYMS=y/' out/.config

        sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' out/.config
        sed -i 's/CONFIG_KALLSYMS_ALL=n/CONFIG_KALLSYMS_ALL=y/' out/.config

        sed -i 's/CONFIG_COMPAT_VDSO=y/CONFIG_COMPAT_VDSO=n/' out/.config

        make O=out ARCH=arm64 olddefconfig

        # 打印核对配置
        grep -E "CONFIG_DEBUG_KERNEL|CONFIG_MODULES|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL" out/.config

        # 模块编译前置
        make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld modules_prepare

    - name: 编译完整内核 Image.gz-dtb
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld
        echo "==== 完整内核编译完成 ===="

    - name: 编译 SukiSU KPM模块 sukisu.ko
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld M=$PWD/sukisu/kernel modules

        find sukisu/kernel -name "*.ko"
        if [ ! -f sukisu/kernel/sukisu.ko ];then
          echo "❌ sukisu.ko 编译失败"
          exit 1
        fi

    - name: 打包 new-boot.img
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        cp android-kernel/boot-14.img base-boot.img
        abootimg -x base-boot.img bootimg.cfg initrd.img zImage
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb zImage
        abootimg --create ${PROJECT_NAME}-${VERSION}.img -f bootimg.cfg -k zImage -r initrd.img
        echo "✅ ${PROJECT_NAME}-${VERSION}.img 打包完成"

    - name: 制作内核AnyKernel3卡刷包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3 ak
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' ak/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' ak/anykernel.sh
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb ak/
        rm -rf ak/.git* ak/README.md
        cd ak
        zip -r ../${PROJECT_NAME}-${VERSION}.zip .
        cd ..

    - name: 上传 new-boot.img
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-boot-img
        path: kernel_workspace/${{ env.PROJECT_NAME }}-${{ env.VERSION }}.img

    - name: 上传 AnyKernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-AnyKernel-zip
        path: kernel_workspace/${{ env.PROJECT_NAME }}-${{ env.VERSION }}.zip
