name: Build SukiSU KPM Cannon
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖包
        run: |
          sudo apt update -y
          sudo apt install -y git curl wget unzip zip bison flex bc libssl-dev libelf-dev python3 cpio rsync tar xz-utils jq

      - name: 拉取cannon内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 获取SukiSU Ultra（内置SUSFS，官方脚本）
        run: |
          wget --retry-connrefused --waitretry=1 --tries=3 https://github.com/SukiSU-Ultra/SukiSU-Ultra/archive/refs/heads/main.zip -O sukisu.zip
          unzip -q sukisu.zip
          mv SukiSU-Ultra-main sukisu

          # 在内核根目录执行setup.sh
          cd "${GITHUB_WORKSPACE}"
          bash sukisu/kernel/setup.sh susfs-main sukisu

          # AnyKernel3
          wget --retry-connrefused --waitretry=1 --tries=3 https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
          unzip -q ak3.zip
          mv AnyKernel3-master ak3

      - name: 获取版本信息
        id: version_info
        run: |
          cd "${GITHUB_WORKSPACE}/sukisu"
          SU_REV=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "SU_REV=${SU_REV}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"

      - name: 下载 ZyCromerZ Clang 14（适配cannon老内核）
        run: |
          mkdir -p clang
          wget --retry-connrefused --waitretry=1 --tries=3 https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20220825-release/Clang-14.0.6-20220825.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C clang
          echo "CLANG_BIN=${GITHUB_WORKSPACE}/clang/bin" >> "${GITHUB_ENV}"
          echo "PATH=${GITHUB_WORKSPACE}/clang/bin:${PATH}" >> "${GITHUB_ENV}"

      - name: 检测并加载cannon内核配置
        run: |
          export PATH="${CLANG_BIN}:${PATH}"
          cd "${GITHUB_WORKSPACE}"
          DEFCONFIG=$(ls arch/arm64/configs/*cannon*defconfig | head -n1)
          if [ -z "${DEFCONFIG}" ];then
            echo "❌ 找不到cannon的defconfig！检查 arch/arm64/configs/"
            exit 1
          fi
          echo "✅ 使用defconfig: ${DEFCONFIG}"
          make ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE= $(basename ${DEFCONFIG})
          # 关闭COMPAT_VDSO，消除CROSS_COMPILE_ARM32依赖
          sed -i 's/CONFIG_COMPAT_VDSO=y/CONFIG_COMPAT_VDSO=n/' .config
          make ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE= modules_prepare

      - name: 编译SukiSU KPM模块（SUSFS已内置）
        run: |
          export PATH="${CLANG_BIN}:${PATH}"
          cd "${GITHUB_WORKSPACE}"
          make ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE= M=${GITHUB_WORKSPACE}/sukisu/kernel KPM=1

      - name: Patch boot镜像
        run: |
          cd "${GITHUB_WORKSPACE}/sukisu"
          if [ ! -f "${GITHUB_WORKSPACE}/boot-14.img" ];then
            echo "❌ 仓库根目录缺少 boot-14.img！"
            exit 1
          fi
          bash kernel/patch.sh "${GITHUB_WORKSPACE}/boot-14.img"
          cp patched-boot.img "${GITHUB_WORKSPACE}/MIUI14_cannon_${BUILD_DATE}_${SU_REV}_boot.img"

      - name: 构建AnyKernel3卡刷包
        run: |
          cd "${GITHUB_WORKSPACE}/ak3"
          rm -rf modules
          mkdir -p modules
          cp "${GITHUB_WORKSPACE}/sukisu/kernel"/*.ko modules/

          echo "BuildDate:${BUILD_DATE}" > info_date.txt
          echo "SukiSU_Rev:${SU_REV}" > info_rev.txt

          > anykernel.sh
          echo 'ui_print("=====================================")' >> anykernel.sh
          echo 'ui_print("  KPM Package")' >> anykernel.sh
          echo 'ui_print("  Build Date: $BUILD_DATE")' >> anykernel.sh
          echo 'ui_print("  SukiSU Commit: $SU_REV")' >> anykernel.sh
          echo 'ui_print("  Platform: MIUI14 cannon")' >> anykernel.sh
          echo 'ui_print("=====================================")' >> anykernel.sh
          echo 'ui_print("- Loading KPM & SUSFS modules")' >> anykernel.sh
          echo 'ui_print("")' >> anykernel.sh

          sed -i "1i BUILD_DATE='${BUILD_DATE}'" anykernel.sh
          sed -i "1i SU_REV='${SU_REV}'" anykernel.sh

          ZIP_NAME="MIUI14_cannon_${BUILD_DATE}_${SU_REV}_KPM_AK3.zip"
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" .
          echo "ZIP_FILE=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MIUI14_cannon_${BUILD_DATE}_${SU_REV}
          path: |
            ${{ github.workspace }}/MIUI14_cannon_${BUILD_DATE}_${SU_REV}_boot.img
            ${{ github.workspace }}/${{ env.ZIP_FILE }}
