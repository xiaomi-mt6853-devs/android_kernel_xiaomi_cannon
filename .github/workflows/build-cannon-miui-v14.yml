name: MIUI14.0.6 Cannon | KPM+SUSFS+APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt update -y
          sudo apt upgrade -y
          sudo apt install -y git curl wget unzip zip bison flex bc libssl-dev libelf-dev python3 cpio rsync tar xz-utils jq

      - name: Checkout 你的cannon内核源码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 拉取 SukiSU-Ultra + SUSFS + AnyKernel3
        run: |
          set -euo pipefail
          # SukiSU-Ultra
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git sukisu
          # SUSFS
          git clone --depth=1 https://github.com/SukiSU-Ultra/SUSFS.git susfs
          # AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3

      - name: Get SukiSU Rev & Build Date
        id: version_info
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/sukisu"
          SU_REV=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "SU_REV=${SU_REV}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"
          echo "Build Info | ${BUILD_DATE} | ${SU_REV}"

      - name: Download SukiSU Manager APK
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          LATEST_APK_URL=$(curl -s https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')
          curl -L --retry 3 -A "Mozilla/5.0" "${LATEST_APK_URL}" -o sukisu-manager.apk

      - name: 下载AOSP Clang工具链
        run: |
          set -euo pipefail
          mkdir -p clang
          CLANG_TAG="android-14.0.0_r47"
          curl -L --retry 3 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/${CLANG_TAG}/clang.tar.gz -o clang.tar.gz
          tar -xf clang.tar.gz -C clang
          echo "CLANG_BIN=${GITHUB_WORKSPACE}/clang/bin" >> "${GITHUB_ENV}"
          echo "PATH=${GITHUB_WORKSPACE}/clang/bin:${PATH}" >> "${GITHUB_ENV}"

      - name: 【关键】配置cannon内核，准备模块编译环境
        run: |
          set -euo pipefail
          export PATH="${CLANG_BIN}:${PATH}"
          cd "${GITHUB_WORKSPACE}"
          # 加载cannon的defconfig，小米cannon在arch/arm64/configs
          make ARCH=arm64 CC=clang cannon_defconfig
          # 生成编译外部模块所需要的内核头文件
          make ARCH=arm64 CC=clang modules_prepare

      - name: 编译SukiSU 和 SUSFS LKM模块（重点！在内核源码目录编译外部模块）
        run: |
          set -euo pipefail
          export PATH="${CLANG_BIN}:${PATH}"
          cd "${GITHUB_WORKSPACE}"
          # 编译SukiSU模块
          make ARCH=arm64 CC=clang M=${GITHUB_WORKSPACE}/sukisu/kernel KPM=1
          # 编译SUSFS模块
          make ARCH=arm64 CC=clang M=${GITHUB_WORKSPACE}/susfs

      - name: Patch boot-14.img，开启KPM
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/sukisu"
          bash kernel/patch.sh "${GITHUB_WORKSPACE}/boot-14.img"
          cp patched-boot.img "${GITHUB_WORKSPACE}/MIUI14_cannon_${BUILD_DATE}_${SU_REV}_boot.img"

      - name: Build AnyKernel3 Zip
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/ak3"
          rm -rf modules
          mkdir -p modules
          # 把编译出来的ko复制到ak3模块文件夹
          cp "${GITHUB_WORKSPACE}/sukisu/kernel"/*.ko modules/
          cp "${GITHUB_WORKSPACE}/susfs"/*.ko modules/
          cp "${GITHUB_WORKSPACE}/sukisu-manager.apk" ./manager.apk

          echo "BuildDate:${BUILD_DATE}" > info_date.txt
          echo "SukiSU_Rev:${SU_REV}" > info_rev.txt

          # 逐行echo生成anykernel.sh，无EOF报错
          > anykernel.sh
          echo 'ui_print("=====================================")' >> anykernel.sh
          echo 'ui_print("  KPM Package")' >> anykernel.sh
          echo 'ui_print("  Build Date: $BUILD_DATE")' >> anykernel.sh
          echo 'ui_print("  SukiSU Commit: $SU_REV")' >> anykernel.sh
          echo 'ui_print("  Platform: MIUI14 cannon")' >> anykernel.sh
          echo 'ui_print("=====================================")' >> anykernel.sh
          echo 'ui_print("- Loading KPM & SUSFS modules")' >> anykernel.sh
          echo 'ui_print("- Included Manager APK")' >> anykernel.sh
          echo 'ui_print("")' >> anykernel.sh
          echo 'ui_print("- Try install Manager APK")' >> anykernel.sh
          echo '# NOTE: Recovery 环境没有pm，这条命令仅在Android系统内生效，卡刷不会执行成功' >> anykernel.sh
          echo '# pm install /tmp/manager.apk' >> anykernel.sh

          sed -i "1i BUILD_DATE='${BUILD_DATE}'" anykernel.sh
          sed -i "1i SU_REV='${SU_REV}'" anykernel.sh

          ZIP_NAME="MIUI14_cannon_${BUILD_DATE}_${SU_REV}_KPM_AK3.zip"
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" .
          echo "ZIP_FILE=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MIUI14_cannon_${BUILD_DATE}_${SU_REV}
          path: |
            ${{ github.workspace }}/MIUI14_cannon_${BUILD_DATE}_${SU_REV}_boot.img
            ${{ github.workspace }}/${{ env.ZIP_FILE }}
