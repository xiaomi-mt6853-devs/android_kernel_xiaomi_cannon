name: Cannon MT6853 Android12 4.14.186 内核 + BakaSU + SUSFS
on:
  workflow_dispatch:
env:
  PROJECT_NAME: Cannon-BakaSU-SUSFS-Kernel
  VERSION: V1.1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      name: 检出fork仓库源码

    - name: 构建编译内核环境 & 创建工作目录
      run: |
        sudo apt-get update
        sudo -E apt-get -y -qq install git make bc bison ccache openssl dos2unix zip unzip kmod cpio flex libelf-dev curl libssl-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi abootimg
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: 下载 AOSP GCC4.9 交叉编译器
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir gcc64
        wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc64/ -zxvf gcc-aarch64.tar.gz

        mkdir gcc32
        wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc32/ -zxvf gcc-arm.tar.gz

    - name: 下载 AOSP Clang10
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

    - name: 集成 BakaSU（KernelSU分支，内置 su）
      run: |
        cd $GITHUB_WORKSPACE
        curl -LSs --retry 3 https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh -o /tmp/bakasu-setup.sh
        bash /tmp/bakasu-setup.sh main
        ls -l drivers/kernelsu
        grep -n "kernelsu" drivers/Makefile
        grep -n "kernelsu" drivers/Kconfig

    - name: 集成 SUSFS v2.3.0 内核补丁 + 非GKI inline hooks
      run: |
        cd $GITHUB_WORKSPACE

        echo "==== 1) 内核侧 SUSFS v2.3.0 (kernel 4.14) ===="
        curl -LSs --retry 3 https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.14.patch -o /tmp/susfs_4.14.patch
        patch -p1 --forward --fuzz=3 --no-backup-if-mismatch < /tmp/susfs_4.14.patch || true

        # 修复 task_mmu.c 的 MTK 特有问题（本地已按该内核逐条验证）：
        #  1) MTK 删掉了 <linux/ctype.h>，SUSFS 补丁的 include 块在 task_mmu.c 定位失败 -> 补回 susfs_def.h
        #  2) MTK 把 smaps 统计拆成 void smap_gather_stats()，SUSFS 的 show_smap(返回int) hunk 被 fuzz 错落到该
        #     void 函数 -> "void function 'smap_gather_stats' should not return a value"。移除错位块并在
        #     int show_smap()/show_smaps_rollup() 里正确重新插入。
        python3 - <<'EOF'
        p = 'fs/proc/task_mmu.c'
        s = open(p).read()

        if 'susfs_def.h' not in s:
            anchor = '#include <linux/mm_inline.h>\n'
            assert anchor in s, 'mm_inline.h anchor missing'
            inc = ('#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || '
                   'defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n'
                   '#include <linux/susfs_def.h>\n'
                   '#endif\n')
            s = s.replace(anchor, anchor + inc, 1)

        block = ('#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n'
                 '\tif (vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n'
                 '\t\treturn 0;\n'
                 '#endif\n')
        if block in s:
            i = s.find(block)
            s = s[:i] + s[i + len(block):]

        memset = '\tmemset(&mss, 0, sizeof(mss));\n'
        cnt = s.count(memset)
        assert cnt >= 1, 'memset anchor missing'
        s = s.replace(memset, block + memset)

        open(p, 'w').write(s)
        print('[fix] task_mmu.c patched:', cnt, 'int-smaps blocks inserted')
        EOF
        rm -f fs/proc/task_mmu.c.rej

        if find . -name '*.rej' | grep -q .; then
          echo "❌ SUSFS 内核补丁存在冲突(.rej)，请根据下列内容手工适配："
          find . -name '*.rej' -print
          find . -name '*.rej' -exec sh -c 'echo "----- {} -----"; cat "{}"' \;
          exit 1
        fi
        test -f fs/susfs.c || { echo "❌ fs/susfs.c 未生成"; exit 1; }
        test -f include/linux/susfs.h || { echo "❌ include/linux/susfs.h 未生成"; exit 1; }
        test -f include/linux/susfs_def.h || { echo "❌ include/linux/susfs_def.h 未生成"; exit 1; }
        grep -q 'SUSFS_VERSION "v2' include/linux/susfs.h || { echo "❌ SUSFS 版本非 v2.x"; grep -n SUSFS_VERSION include/linux/susfs.h; exit 1; }

        echo "==== 2) KernelSU 非GKI inline hooks (ksu_handle_*) ===="
        curl -LSs --retry 3 https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh -o /tmp/susfs_inline.sh
        bash /tmp/susfs_inline.sh

        echo "==== 3) 校验 BakaSU inline_hook_check 需要的调用点 ===="
        for chk in "ksu_handle_setresuid:kernel/sys.c" "ksu_handle_execveat:fs/exec.c" "ksu_handle_faccessat:fs/open.c" "ksu_handle_sys_read:fs/read_write.c" "ksu_handle_stat:fs/stat.c" "ksu_handle_sys_reboot:kernel/reboot.c" "ksu_handle_input_handle_event:drivers/input/input.c"; do
          sym=${chk%%:*}; file=${chk##*:}
          if ! grep -q "$sym" "$file"; then echo "❌ 缺少 $sym in $file"; exit 1; fi
          echo "✅ $sym -> $file"
        done
        echo "✅ SUSFS v2.3.0 + inline hooks 集成完成"

    - name: 设置ccache缓存
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-cannon-mt6853-full-kernel-bakasu
        max-size: 1G

    - name: 清理旧out输出目录
      run: |
        cd $GITHUB_WORKSPACE
        rm -rf out

    - name: 加载defconfig，开启 BakaSU + SUSFS 配置
      run: |
        cd $GITHUB_WORKSPACE
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH

        # 注意：必须用 cannon_defconfig（该机型专用配置），它内置 AW87519/AW87359 音频功放、
        # REGULATOR_PM8008(camera_power)、NFC pn553/p73、ov02b10 摄像头 OTP 等项目驱动。
        # 之前误用通用 k6853v1_64_defconfig 导致 vmlinux 链接期这些符号 undefined symbol。
        make -s -j$(nproc --all) O=out ARCH=arm64 cannon_defconfig

        # BakaSU 必需配置（CONFIG_KSU 来自集成后的 drivers/kernelsu/Kconfig）
        scripts/config --file out/.config -e DEBUG_KERNEL
        scripts/config --file out/.config -e KALLSYMS
        scripts/config --file out/.config -e KALLSYMS_ALL
        scripts/config --file out/.config -e KSU
        # 4.14 非GKI：使用 SUSFS Inline Hook 模式（内核侧已打 SUSFS v2.3.0 + inline hooks）
        scripts/config --file out/.config -e KSU_SUSFS
        scripts/config --file out/.config -d KSU_MANUAL_HOOK
        scripts/config --file out/.config -d KSU_TRACEPOINT_HOOK
        # SUSFS 功能子开关（默认即 y，这里显式开启）
        scripts/config --file out/.config -e KSU_SUSFS_SUS_PATH
        scripts/config --file out/.config -e KSU_SUSFS_SUS_MOUNT
        scripts/config --file out/.config -e KSU_SUSFS_SUS_KSTAT
        scripts/config --file out/.config -e KSU_SUSFS_SPOOF_UNAME
        scripts/config --file out/.config -e KSU_SUSFS_ENABLE_LOG
        scripts/config --file out/.config -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
        scripts/config --file out/.config -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
        scripts/config --file out/.config -e KSU_SUSFS_OPEN_REDIRECT
        scripts/config --file out/.config -e KSU_SUSFS_SUS_MAP
        scripts/config --file out/.config -d COMPAT_VDSO

        make -s O=out ARCH=arm64 olddefconfig

        # 打印核对配置
        grep -E "CONFIG_KSU=|CONFIG_KSU_SUSFS|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KSU_SUSFS_SUS_PATH|CONFIG_KSU_SUSFS_SUS_MOUNT|CONFIG_KSU_SUSFS_SUS_MAP|CONFIG_DEBUG_KERNEL|CONFIG_MODULES|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL|CONFIG_COMPAT_VDSO|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE" out/.config
        grep -q "^CONFIG_KSU=y" out/.config || { echo "❌ CONFIG_KSU 未开启"; exit 1; }
        grep -q "^CONFIG_KSU_SUSFS=y" out/.config || { echo "❌ CONFIG_KSU_SUSFS 未开启"; exit 1; }
        grep -q "^# CONFIG_KSU_MANUAL_HOOK is not set" out/.config || { echo "❌ CONFIG_KSU_MANUAL_HOOK 必须关闭"; exit 1; }
        grep -q "^# CONFIG_KSU_TRACEPOINT_HOOK is not set" out/.config || { echo "❌ CONFIG_KSU_TRACEPOINT_HOOK 必须关闭"; exit 1; }

        # MTK 厂商驱动符号检查（缺了 vmlinux 链接期会 undefined symbol）
        grep -q "^CONFIG_SND_SOC_AW87519=y" out/.config || { echo "❌ CONFIG_SND_SOC_AW87519 未开启"; exit 1; }
        grep -q "^CONFIG_SND_SOC_AW87359=y" out/.config || { echo "❌ CONFIG_SND_SOC_AW87359 未开启"; exit 1; }
        grep -q "^CONFIG_NFC_PN553_DEVICES=y" out/.config || { echo "❌ CONFIG_NFC_PN553_DEVICES 未开启"; exit 1; }
        grep -q "^CONFIG_NXP_P73_DEVICES=y" out/.config || { echo "❌ CONFIG_NXP_P73_DEVICES 未开启"; exit 1; }
        grep -q "^CONFIG_REGULATOR_PM8008=y" out/.config || { echo "❌ CONFIG_REGULATOR_PM8008 未开启"; exit 1; }
        grep -q "^CONFIG_MTK_IMGSENSOR=y" out/.config || { echo "❌ CONFIG_MTK_IMGSENSOR 未开启"; exit 1; }
        grep -q '^CONFIG_ARCH_MTK_PROJECT="k6853v1_64_6360"' out/.config || { echo "❌ CONFIG_ARCH_MTK_PROJECT 应为 k6853v1_64_6360"; exit 1; }
        grep -q '^CONFIG_CUSTOM_KERNEL_IMGSENSOR=".*ov02b10ofilm_mipi_raw.*"' out/.config || { echo "❌ CONFIG_CUSTOM_KERNEL_IMGSENSOR 缺少 ov02b10ofilm_mipi_raw"; exit 1; }

    - name: 编译完整内核 Image.gz-dtb（内置 BakaSU + SUSFS）
      run: |
        cd $GITHUB_WORKSPACE
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH

        echo "==== 编译环境诊断 ===="
        nproc
        df -h /
        free -m | head -2

        # GitHub Actions 免费runner(2核/7G) 并行度过高+ccache 易触发 clang 内存/管道崩溃：
        # "LLVM ERROR: IO failure on output stream: Broken pipe"，固定 -j2 并允许失败后增量续跑
        JOBS=2
        CMD=(make -s -j$JOBS CC="ccache clang" O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld Image.gz-dtb)
        for attempt in 1 2 3; do
          echo "==== 编译尝试 #${attempt} ===="
          "${CMD[@]}" || true
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && break
        done

        ls -l out/arch/arm64/boot/Image.gz-dtb out/vmlinux
        test -f out/arch/arm64/boot/Image.gz-dtb || { echo "❌ Image.gz-dtb 编译失败"; exit 1; }
        echo "==== 完整内核编译完成，BakaSU + SUSFS 已内置 ===="

    - name: 打包 new-boot.img
      run: |
        cd $GITHUB_WORKSPACE
        cp boot-14.img kernel_workspace/base-boot.img
        cd kernel_workspace
        abootimg -x base-boot.img bootimg.cfg initrd.img zImage
        cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb zImage
        abootimg --create ${PROJECT_NAME}-${VERSION}.img -f bootimg.cfg -k zImage -r initrd.img
        echo "✅ ${PROJECT_NAME}-${VERSION}.img 打包完成"

    - name: 制作内核AnyKernel3卡刷包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3 ak
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' ak/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' ak/anykernel.sh
        cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb ak/
        rm -rf ak/.git* ak/README.md
        cd ak
        zip -r ../${PROJECT_NAME}-${VERSION}.zip .
        cd ..

    - name: 上传 new-boot.img
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-boot-img
        path: kernel_workspace/${{ env.PROJECT_NAME }}-${{ env.VERSION }}.img

    - name: 上传 AnyKernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-AnyKernel-zip
        path: kernel_workspace/${{ env.PROJECT_NAME }}-${{ env.VERSION }}.zip