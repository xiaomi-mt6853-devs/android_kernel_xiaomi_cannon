name: Build SukiSU KPM Cannon
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装基础依赖 + aarch64交叉gcc
        run: |
          sudo apt update -y
          sudo apt install -y git curl wget unzip zip bison flex bc libssl-dev libelf-dev python3 cpio rsync tar xz-utils jq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: 拉取cannon内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 获取SukiSU Ultra（开启KPM）
        run: |
          wget --retry-connrefused --waitretry=1 --tries=3 https://github.com/SukiSU-Ultra/SukiSU-Ultra/archive/refs/heads/main.zip -O sukisu.zip
          unzip -q sukisu.zip
          mv SukiSU-Ultra-main sukisu

          cd "${GITHUB_WORKSPACE}"
          # 重点：增加 KPM=1 传给setup.sh，启用KPM
          bash sukisu/kernel/setup.sh KPM=1 susfs-main sukisu

          # AnyKernel3
          wget --retry-connrefused --waitretry=1 --tries=3 https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
          unzip -q ak3.zip
          mv AnyKernel3-master ak3

      - name: 获取版本信息
        id: version_info
        run: |
          cd "${GITHUB_WORKSPACE}/sukisu"
          SU_REV=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "SU_REV=${SU_REV}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"

      - name: 打印编译器版本校验
        run: |
          aarch64-linux-gnu-gcc --version

      - name: 加载defconfig & modules_prepare
        run: |
          cd "${GITHUB_WORKSPACE}"
          DEFCONFIG=$(ls arch/arm64/configs/*cannon*defconfig | head -n1)
          if [ -z "${DEFCONFIG}" ];then
            echo "❌ 找不到cannon的defconfig！检查 arch/arm64/configs/"
            exit 1
          fi
          echo "✅ 使用defconfig: ${DEFCONFIG}"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- $(basename ${DEFCONFIG})
          sed -i 's/CONFIG_COMPAT_VDSO=y/CONFIG_COMPAT_VDSO=n/' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

      - name: 编译SukiSU KPM模块
        run: |
          cd "${GITHUB_WORKSPACE}"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=${GITHUB_WORKSPACE}/sukisu/kernel

      - name: 构建AnyKernel3 KPM卡刷包
        run: |
          cd "${GITHUB_WORKSPACE}/ak3"
          rm -rf modules
          mkdir -p modules
          cp "${GITHUB_WORKSPACE}/sukisu/kernel"/*.ko modules/

          echo "BuildDate:${BUILD_DATE}" > info_date.txt
          echo "SukiSU_Rev:${SU_REV}" > info_rev.txt

          > anykernel.sh
          echo 'ui_print("=====================================")' >> anykernel.sh
          echo 'ui_print("  SukiSU Ultra KPM Package")' >> anykernel.sh
          echo 'ui_print("  Build Date: '"${BUILD_DATE}"'")' >> anykernel.sh
          echo 'ui_print("  SukiSU Commit: '"${SU_REV}"'")' >> anykernel.sh
          echo 'ui_print("  Device: Xiaomi cannon 4.14 Non-GKI")' >> anykernel.sh
          echo 'ui_print("=====================================")' >> anykernel.sh
          echo 'ui_print("- Loading KPM & SUSFS modules")' >> anykernel.sh
          echo 'ui_print("")' >> anykernel.sh

          ZIP_NAME="cannon_4.14_SukiSU_KPM_${BUILD_DATE}_${SU_REV}.zip"
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" .
          echo "ZIP_FILE=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: 上传AnyKernel3卡刷包
        uses: actions/upload-artifact@v4
        with:
          name: cannon_4.14_SukiSU_KPM_${BUILD_DATE}_${SU_REV}
          path: |
            ${{ github.workspace }}/${{ env.ZIP_FILE }}
